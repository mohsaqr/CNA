title: Binary Data (Single/Group)
name: CNABinarySingle
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: One-Hot Columns
        children:
          - type: VariablesListBox
            name: buildModel_variables_onehot
            isTarget: true
      - type: TargetLayoutBox
        label: Actor (Optional)
        children:
          - type: VariablesListBox
            name: buildModel_variables_actor
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Session (Optional)
        children:
          - type: VariablesListBox
            name: buildModel_variables_session
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Group Variable (Optional)
        children:
          - type: VariablesListBox
            name: buildModel_variables_group
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    stretchFactor: 1
    style: inline
    children:
      - type: LayoutBox
        stretchFactor: 1
        children:
          - type: Label
            label: Scaling
            children:
              - type: RadioButton
                name: buildModel_scaling_noScaling
                optionName: buildModel_scaling
                optionPart: noScaling
              - type: RadioButton
                name: buildModel_scaling_minmax
                optionName: buildModel_scaling
                optionPart: minmax
              - type: RadioButton
                name: buildModel_scaling_max
                optionName: buildModel_scaling
                optionPart: max
              - type: RadioButton
                name: buildModel_scaling_rank
                optionName: buildModel_scaling
                optionPart: rank
      - type: LayoutBox
        stretchFactor: 1
        children:
          - type: Label
            label: Windowing
            children:
              - type: TextBox
                name: buildModel_window
                format: number
                label: Window size
              - type: RadioButton
                name: buildModel_window_type_tumbling
                optionName: buildModel_window_type
                optionPart: tumbling
              - type: RadioButton
                name: buildModel_window_type_sliding
                optionName: buildModel_window_type
                optionPart: sliding
          - type: Label
            label: Basic Options
            children:
              - type: CheckBox
                name: buildModel_show_matrix
                label: Matrix
  - type: Label
    label: ━━ 𝗡𝗲𝘁𝘄𝗼𝗿𝗸 𝗔𝗻𝗮𝗹𝘆𝘀𝗶𝘀 ━━
    style: list-inline
    margin: large
  - type: CollapseBox
    label: Visualization Settings
    margin: large
    stretchFactor: 1
    style: inline
    collapsed: true
    children:
      - type: LayoutBox
        stretchFactor: 1
        children:
          - type: Label
            label: Display Options
            children:
              - type: CheckBox
                name: buildModel_show_plot
                label: Network plot
              - type: CheckBox
                name: buildModel_show_histo
                label: Histogram
              - type: CheckBox
                name: buildModel_show_frequencies
                label: Frequencies plot
              - type: CheckBox
                name: buildModel_show_mosaic
                label: Mosaic plot
              - type: CheckBox
                name: buildModel_show_distribution
                label: Distribution plot
              - type: CheckBox
                name: buildModel_show_mixed
                label: Mixed network (transition + co-occurrence)
  - type: CollapseBox
    label: Centrality Analysis
    margin: large
    stretchFactor: 1
    style: inline
    collapsed: true
    children:
      - type: LayoutBox
        stretchFactor: 1
        children:
          - type: Label
            label: Display Options
            children:
              - type: CheckBox
                name: centrality_show_table
                label: Table
              - type: CheckBox
                name: centrality_show_plot
                label: Plot
              - type: ComboBox
                name: centrality_plot_style
                enable: (centrality_show_plot)
          - type: Label
            label: Parameters
            children:
              - type: CheckBox
                name: centrality_loops
                label: Include loops
              - type: CheckBox
                name: centrality_normalize
                label: Normalize values
      - type: LayoutBox
        stretchFactor: 1
        children:
          - type: Label
            label: Measures
            children:
              - type: CheckBox
                name: centrality_OutStrength
                label: Out Strength
              - type: CheckBox
                name: centrality_InStrength
                label: In Strength
              - type: CheckBox
                name: centrality_Closeness
                label: Closeness
              - type: CheckBox
                name: centrality_Betweenness
                label: Betweenness
  - type: CollapseBox
    label: Community Detection
    margin: large
    stretchFactor: 1
    style: inline
    collapsed: true
    children:
      - type: LayoutBox
        stretchFactor: 1
        children:
          - type: Label
            label: Display Options
            children:
              - type: CheckBox
                name: community_show_table
                label: Table
              - type: CheckBox
                name: community_show_plot
                label: Plot
          - type: Label
            label: Parameters
            children:
              - type: TextBox
                name: community_gamma
                format: number
      - type: LayoutBox
        stretchFactor: 1
        children:
          - type: Label
            label: Method
            children:
              - type: RadioButton
                name: community_methods_louvain
                optionName: community_methods
                optionPart: louvain
              - type: RadioButton
                name: community_methods_walktrap
                optionName: community_methods
                optionPart: walktrap
              - type: RadioButton
                name: community_methods_fast_greedy
                optionName: community_methods
                optionPart: fast_greedy
              - type: RadioButton
                name: community_methods_label_prop
                optionName: community_methods
                optionPart: label_prop
              - type: RadioButton
                name: community_methods_infomap
                optionName: community_methods
                optionPart: infomap
              - type: RadioButton
                name: community_methods_leiden
                optionName: community_methods
                optionPart: leiden
  - type: CollapseBox
    label: Reliability & Stability
    margin: large
    stretchFactor: 1
    style: inline
    collapsed: true
    children:
      - type: LayoutBox
        stretchFactor: 1
        children:
          - type: Label
            label: Display Options
            children:
              - type: CheckBox
                name: stability_show_table
                label: Table
              - type: CheckBox
                name: stability_show_plot
                label: Plot
      - type: LayoutBox
        stretchFactor: 1
        children:
          - type: Label
            label: Parameters
            children:
              - type: TextBox
                name: stability_iter
                format: number
                label: Iterations
              - type: TextBox
                name: stability_threshold
                format: number
                label: Stability threshold
  - type: Label
    label: ━━ 𝗖𝗼𝗻𝗳𝗶𝗿𝗺𝗮𝘁𝗼𝗿𝘆 𝗧𝗲𝘀𝘁𝗶𝗻𝗴 ━━
    style: list-inline
    margin: large
  - type: CollapseBox
    label: Bootstrap Analysis
    margin: large
    stretchFactor: 1
    style: inline
    collapsed: true
    children:
      - type: LayoutBox
        stretchFactor: 1
        children:
          - type: Label
            label: Display Options
            children:
              - type: CheckBox
                name: bootstrap_show_plot
                label: Plot
              - type: CheckBox
                name: bootstrap_show_table
                label: Table
          - type: Label
            label: Parameters
            children:
              - type: TextBox
                name: bootstrap_iteration
                format: number
              - type: TextBox
                name: bootstrap_level
                format: number
          - type: Label
            label: Method
            children:
              - type: RadioButton
                name: bootstrap_method_stability
                optionName: bootstrap_method
                optionPart: stability
              - type: RadioButton
                name: bootstrap_method_threshold
                optionName: bootstrap_method
                optionPart: threshold
      - type: LayoutBox
        stretchFactor: 1
        children:
          - type: Label
            label: Method Parameters
            children:
              - type: TextBox
                name: bootstrap_range_low
                format: number
                enable: (bootstrap_method_stability)
              - type: TextBox
                name: bootstrap_range_up
                format: number
                enable: (bootstrap_method_stability)
              - type: TextBox
                name: bootstrap_threshold
                format: number
                enable: (bootstrap_method_threshold)
          - type: Label
            label: Table Options
            children:
              - type: TextBox
                name: bootstrap_table_max_rows
                format: number
              - type: CheckBox
                name: bootstrap_table_show_all
                label: Show all rows
              - type: CheckBox
                name: bootstrap_table_significant_only
                label: Significant only
  - type: CollapseBox
    label: Permutation Analysis
    margin: large
    stretchFactor: 1
    style: inline
    collapsed: true
    children:
      - type: LayoutBox
        stretchFactor: 1
        children:
          - type: Label
            label: Display Options
            children:
              - type: CheckBox
                name: permutation_show_table
                label: Table
              - type: CheckBox
                name: permutation_show_plot
                label: Plot
          - type: Label
            label: Parameters
            children:
              - type: TextBox
                name: permutation_iter
                format: number
              - type: TextBox
                name: permutation_level
                format: number
              - type: CheckBox
                name: permutation_paired
                label: Paired
      - type: LayoutBox
        stretchFactor: 1
        children:
          - type: Label
            label: Table Options
            children:
              - type: TextBox
                name: permutation_table_max_rows
                format: number
              - type: CheckBox
                name: permutation_table_show_all
                label: Show all rows
  - type: CollapseBox
    label: Compare Network Properties
    margin: large
    stretchFactor: 1
    style: inline
    collapsed: true
    children:
      - type: LayoutBox
        stretchFactor: 1
        children:
          - type: Label
            label: Networks
            children:
              - type: LevelSelector
                name: compare_group_i
              - type: LevelSelector
                name: compare_group_j
          - type: Label
            label: Display Options
            children:
              - type: CheckBox
                name: compare_show_summary
                label: Summary metrics table
              - type: CheckBox
                name: compare_show_network
                label: Network properties table
              - type: CheckBox
                name: compare_show_plot
                label: Comparison plot
      - type: LayoutBox
        stretchFactor: 1
        children:
          - type: Label
            label: Options
            children:
              - type: ComboBox
                name: compare_plot_type
              - type: ComboBox
                name: compare_scaling
