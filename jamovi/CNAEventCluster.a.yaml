---
name:  CNAEventCluster
title: Event Data (Clustering)
menuGroup: Co-occurrence Network Analysis
menuSubgroup: Event Data
menuTitle: Clustering
version: '1.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    ### EVENT DATA INPUTS

    - name: buildModel_variables_long_action
      title: Action
      type: Variable

    - name: buildModel_variables_long_time
      title: Time (Optional)
      type: Variable

    - name: buildModel_variables_long_order
      title: Order (Optional)
      type: Variable

    ### SHARED INPUTS

    - name: buildModel_variables_actor
      title: Actor (Optional)
      type: Variable

    ### CLUSTERING INPUTS

    - name: clustering_k
      title: Number of Clusters (k)
      type: Integer
      default: 2
      min: 2
      max: 20

    - name: clustering_run
      title: Run Clustering Analysis
      type: Bool
      default: false

    - name: clustering_dissimilarity
      title: Dissimilarity
      type: List
      default: hamming
      options:
        - name: hamming
          title: Hamming
        - name: osa
          title: OSA
        - name: lv
          title: Levenshtein
        - name: lcs
          title: LCS
        - name: jaccard
          title: Jaccard
        - name: jw
          title: Jaro-Winkler

    - name: clustering_method
      title: Method
      type: List
      default: pam
      options:
        - name: pam
          title: PAM
        - name: ward.D2
          title: Ward D2
        - name: complete
          title: Complete
        - name: average
          title: Average
        - name: single
          title: Single

    ### BUILD MODEL DATA

    - name: buildModel_scaling
      title: Scaling
      type: List
      options:
        - title: No scaling
          name:  noScaling
        - title: MinMax
          name:  minmax
        - title: Max
          name:  max
        - title: Rank
          name:  rank
      default: noScaling

    - name: buildModel_threshold
      title: Threshold
      type: Integer
      default: 900

    ##### DISPLAY OPTIONS

    - name: buildModel_show_matrix
      title: Matrix
      type: Bool
      default: False

    - name: buildModel_show_plot
      title: Plot
      type: Bool
      default: True

    - name: buildModel_show_histo
      title: Histogram
      type: Bool
      default: False

    - name: buildModel_show_frequencies
      title: Frequencies plot
      type: Bool
      default: False

    - name: buildModel_show_mosaic
      title: Mosaic plot
      type: Bool
      default: False

    - name: buildModel_show_distribution
      title: Distribution plot
      type: Bool
      default: False

    ##### PLOT PARAMS

    ### CENTRALITY DATA

    - name: centrality_loops
      title: loops
      type: Bool
      default: False

    - name: centrality_normalize
      title: normalize
      type: Bool
      default: False

    - name: centrality_show_table
      title: Table
      type: Bool
      default: False

    - name: centrality_show_plot
      title: Plot
      type: Bool
      default: False

    - name: centrality_plot_style
      title: Plot style
      type: List
      default: lollipop
      options:
        - name: lollipop
          title: Lollipop
        - name: bar
          title: Bar
        - name: line
          title: Line
        - name: dot
          title: Dot
        - name: heatmap
          title: Heatmap
        - name: distribution
          title: Distribution

    - name: centrality_Betweenness
      title: Betweenness
      type: Bool
      default: True

    - name: centrality_Closeness
      title: Closeness
      type: Bool
      default: False

    - name: centrality_InStrength
      title: InStrength
      type: Bool
      default: True

    - name: centrality_OutStrength
      title: OutStrength
      type: Bool
      default: True

    ### COMMUNITY DATA

    - name: community_methods
      title: Methods
      type: List
      default: louvain
      options:
      - name: louvain
        title: Louvain
      - name: walktrap
        title: Walktrap
      - name: fast_greedy
        title: Fast greedy
      - name: label_prop
        title: Label Prop
      - name: infomap
        title: Infomap
      - name: leiden
        title: Leiden

    - name: community_gamma
      title: Gamma
      type: Integer
      default: 1
      min: 0
      max: 100

    - name: community_show_table
      title: Table
      type: Bool
      default: False

    - name: community_show_plot
      title: Plot
      type: Bool
      default: False

    ### RELIABILITY & STABILITY

    - name: stability_show_table
      title: Table
      type: Bool
      default: false

    - name: stability_show_plot
      title: Plot
      type: Bool
      default: false

    - name: stability_iter
      title: Iterations
      type: Integer
      default: 500
      min: 50
      max: 5000

    - name: stability_threshold
      title: Stability threshold
      type: Number
      default: 0.7
      min: 0
      max: 1

    ### BOOTSTRAP

    - name: bootstrap_iteration
      title: Iteration
      type: Integer
      default: 1000
      min: 0
      max: 10000

    - name: bootstrap_level
      title: Level
      type: Number
      default: 0.05
      min: 0
      max: 1

    - name: bootstrap_method
      title: Method
      type: List
      default: stability
      options:
        - title: Stability
          name: stability
        - title: Threshold
          name: threshold

    - name: bootstrap_range_low
      title: Lower
      type: Number
      default: 0.75
      min: 0
      max: 10

    - name: bootstrap_range_up
      title: Upper
      type: Number
      default: 1.25
      min: 0
      max: 10

    - name: bootstrap_threshold
      title: Threshold
      type: Number
      default: 0.1
      min: 0
      max: 1

    - name: bootstrap_show_plot
      title: Plot
      type: Bool
      default: False

    - name: bootstrap_show_table
      title: Table
      type: Bool
      default: False

    - name: bootstrap_table_max_rows
      title: Max rows
      type: Integer
      default: 20
      min: 1
      max: 1000

    - name: bootstrap_table_show_all
      title: Show all rows
      type: Bool
      default: False

    - name: bootstrap_table_significant_only
      title: Significant only
      type: Bool
      default: False

    ### PERMUTATION

    - name: permutation_show_table
      title: Table
      type: Bool
      default: False

    - name: permutation_show_plot
      title: Plot
      type: Bool
      default: False

    - name: permutation_iter
      title: Iterations
      type: Integer
      default: 1000
      min: 1
      max: 10000

    - name: permutation_paired
      title: Paired
      type: Bool
      default: False

    - name: permutation_level
      title: Level
      type: Number
      default: 0.05
      min: 0
      max: 1

    - name: permutation_table_max_rows
      title: Max rows
      type: Integer
      default: 50
      min: 1
      max: 1000

    - name: permutation_table_show_all
      title: Show all rows
      type: Bool
      default: False

    ### COMPARE CLUSTERS

    - name: compare_show_summary
      title: Summary Metrics Table
      type: Bool
      default: False

    - name: compare_show_network
      title: Network Properties Table
      type: Bool
      default: False

    - name: compare_show_plot
      title: Comparison Plot
      type: Bool
      default: False

    - name: compare_cluster_i
      title: First Cluster
      type: Integer
      default: 1
      min: 1
      max: 20

    - name: compare_cluster_j
      title: Second Cluster
      type: Integer
      default: 2
      min: 1
      max: 20

    - name: compare_scaling
      title: Scaling
      type: List
      default: none
      options:
        - title: None
          name: none
        - title: MinMax
          name: minmax
        - title: Max
          name: max
        - title: Rank
          name: rank

    - name: compare_plot_type
      title: Plot Type
      type: List
      default: heatmap
      options:
        - title: Heatmap
          name: heatmap
        - title: Scatterplot
          name: scatterplot
        - title: Weight Density
          name: weight_density

...
