  - TNA
  - TNALAK
items:

    - name: instructions
      title: Instructions
      type: Html
      visible: True
      clearWith:
        - buildModel_variables_onehot
        - buildModel_variables_actor
        - buildModel_variables_session
        - buildModel_variables_group

    - name: errorText
      title: Error
      type: Preformatted
      visible: False
      clearWith:
        - buildModel_variables_onehot
        - buildModel_variables_actor
        - buildModel_variables_session
        - buildModel_variables_group

    - name:  tnaTitle
      title: Binary Data (Single/Group)
      type:  Preformatted
      visible: True

